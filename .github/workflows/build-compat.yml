name: Build Compat Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v2.5.8-compat.1)'
        required: false
        default: 'v2.5.8-compat.1'
  push:
    tags:
      - 'v*-compat*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (Compat Edition)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          targets: x86_64-pc-windows-msvc

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies & run prebuild
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run prebuild x86_64-pc-windows-msvc
        shell: bash

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Clash Verge Rev Compat Edition ${{ inputs.tag_name || github.ref_name }}'
          releaseDraft: false
          releaseBody: |
            ## 🚀 Clash Verge Rev Compat Edition（双内核兼容版）

            本版本在官方 Clash Verge Rev（v2.5.8 代码基线）的基础上，额外内置 **v2.5.1 稳定兼容内核（Mihomo v1.19.25）**，用于解决部分机场订阅在新版内核下 **节点丢失 / 显示 Unknown / 解析超时** 的问题。客户端功能与官方最新版完全一致，无需降级、无需改动订阅，一键切换内核即可恢复正常。

            ### ✨ 核心特性

            - **三内核自由切换**：`设置` → `Clash 内核` ⚙ 中可在 `Mihomo 正式版`、`Mihomo Alpha`、`Mihomo Compat (v2.5.1)` 之间自由切换，自动重启生效；
            - **订阅零改动**：切换内核不影响订阅链接、配置文件与规则；
            - **服务模式与 TUN 模式全面兼容**：兼容内核已连同 SHA256 一起注册进补丁版系统服务，TUN 虚拟网卡正常可用；
            - **内核升级保护**：兼容内核固定为 v1.19.25，「升级内核」不会误覆盖它；
            - **内核来源干净**：直接取自 [MetaCubeX/mihomo](https://github.com/MetaCubeX/mihomo) 官方 Release v1.19.25，未做修改，构建时强制 SHA256 校验。

            ### 📥 下载与安装

            | 文件 | 说明 |
            | :--- | :--- |
            | `Clash.Verge_2.5.8_x64-setup.exe` | Windows 10/11 x64 安装包 |
            | `Clash.Verge_2.5.8_x64-setup.zip` | 同一安装包的 zip 打包；浏览器出现下载拦截提示时可选此格式，解压后得到相同的 exe |

            - 支持从官方版直接**覆盖安装**（安装器会自动停止正在运行的内核与客户端进程）；
            - 如遇异常可先卸载官方版再安装，配置目录不受影响；
            - 安装包内置全部三个内核，并自动完成系统服务注册。

            ### 💡 下载提示

            - 下载 exe 时浏览器若提示 **「通常不会下载 Clash.Verge_2.5.8_x64-setup.exe。请在打开前确保信任」**：这是 Windows 对**未经代码签名**且下载信誉尚未积累的新文件的**标准信誉提示，不是病毒报告**。点击下载项右侧 `···` → **「保留」**（如出现二次确认选 **「仍然保留」**）即可；
            - 不想遇到该提示，可直接下载 **`.zip` 版本**（浏览器不拦截 zip），解压后得到完全相同的安装包；
            - 安装时若遇 SmartScreen 蓝色提示 **「Windows 已保护你的电脑」**：点击 **「更多信息」→「仍要运行」**；
            - 安装包直接发布于 GitHub Releases 官方存储，未经任何第三方改动；对来源有更高要求的用户可参照仓库文档自行构建。

            ### 📖 使用方法

            1. 打开客户端，进入左侧 **「设置」**；
            2. 找到 **「Clash 内核」**，点击右侧 **⚙ 齿轮**；
            3. 选择 **「兼容版 (v2.5.1)」**，内核自动重启；
            4. 回到「代理」页刷新，订阅节点即恢复正常。

            ### ⚠️ 注意事项

            - **客户端自动更新已禁用**：一是因为本分支无官方更新签名私钥；二是内置更新源指向官方仓库，若保留会导致「检查更新」直接装回官方版、兼容内核丢失。**新版本请回到本仓库 [Releases](https://github.com/dai123x/clash-verge-rev/releases) 手动下载**；
            - 当前流水线只产出 **Windows x64** 安装包，macOS / Linux 用户可参照仓库文档自行构建；
            - 遇到「IP 信息」卡 Request cancelled / 新域名经代理超时，请参照更新日志中 compat.4 的 `dns_config.yaml` 手动修复说明；
            - 完整文档（与官方版差异 / 技术实现 / 自行构建 / FAQ）：**[docs/COMPAT_EDITION.md](https://github.com/dai123x/clash-verge-rev/blob/dev/docs/COMPAT_EDITION.md)**；
            - 各版本改动明细：**[docs/CHANGELOG_COMPAT.md](https://github.com/dai123x/clash-verge-rev/blob/dev/docs/CHANGELOG_COMPAT.md)**。

            ### 🙌 致谢

            - 上游项目：[clash-verge-rev/clash-verge-rev](https://github.com/clash-verge-rev/clash-verge-rev)（GPL-3.0）
            - 内核项目：[MetaCubeX/mihomo](https://github.com/MetaCubeX/mihomo)

            问题反馈请提交 [Issue](https://github.com/dai123x/clash-verge-rev/issues)。
          # Compat 版不签名更新产物（无私钥），并清空官方更新源，防止客户端自动更新回官方版丢失兼容内核
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.compat.conf.json

      - name: Zip installer and upload (avoids browser download reputation warning)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          # Root Cargo workspace puts target/ at the repo root, not src-tauri/target/.
          $exe = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path "." -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'bundle[\\/]nsis' } | Select-Object -First 1
          }
          $zip = "$($exe.BaseName).zip"
          Compress-Archive -LiteralPath $exe.FullName -DestinationPath $zip -Force
          # Publish verifiable checksums so users can validate downloads without trusting the browser.
          $hashLines = Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName, $zip |
            ForEach-Object { "$($_.Hash.ToLower())  $((Split-Path -Path $_.Path -Leaf))" }
          Set-Content -Path "SHA256SUMS.txt" -Value $hashLines -Encoding ascii
          Get-Content "SHA256SUMS.txt"
          gh release upload "$env:TAG_NAME" "$zip" "SHA256SUMS.txt" --clobber
